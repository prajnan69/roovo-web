    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">

  <meta property="og:image" content="/logo-square-640.jpg" />
  <meta name="theme-color" content="#6366f1" />
</head>

<body>
  <!-- Static boot screen: paints before any JS parses, so WebView (re)starts
       (first boot, post-OTA reload, rollback) never show a raw white screen.
       Removed by App.tsx once React mounts. -->
  <style>
    #boot-splash{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center}
    #boot-splash .bs-dot{width:14px;height:14px;border-radius:50%;background:#6366F1;animation:bs-pulse 1.1s ease-in-out infinite}
    @keyframes bs-pulse{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(1.9);opacity:1}}
  </style>
  <div id="boot-splash"><div class="bs-dot"></div></div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
